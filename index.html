<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUXIMONES | Royal Italian Dining</title>

<meta name="description" content="LUXIMONES — Where Italian Heritage Meets Royal Dining.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Georgia,serif;
    background:#050505;
    color:#f5e8c8;
    overflow-x:hidden;
}

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 35%,#49351c 0%,#171109 28%,#050505 70%);
}

.stars{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(#fff 1px,transparent 1px),
        radial-gradient(#d9b66f 1px,transparent 1px);
    background-size:90px 90px,140px 140px;
    opacity:.35;
    animation:stars 12s linear infinite;
}

@keyframes stars{
    from{transform:translateY(0)}
    to{transform:translateY(-90px)}
}

.moon{
    position:absolute;
    top:10%;
    right:12%;
    width:110px;
    height:110px;
    border-radius:50%;
    background:#fff0c4;
    box-shadow:0 0 60px #e7c46c;
}

.palace{
    position:absolute;
    bottom:0;
    width:min(850px,95vw);
    height:48vh;
    min-height:300px;
    perspective:900px;
}

.palace-body{
    position:absolute;
    bottom:0;
    left:5%;
    width:90%;
    height:75%;
    background:linear-gradient(#302517,#100d09);
    border:3px solid #9d7940;
    box-shadow:
        0 0 40px #b88a3b55,
        inset 0 0 40px #000;
    transform:rotateX(3deg);
}

.dome{
    position:absolute;
    top:-90px;
    left:28%;
    width:44%;
    height:150px;
    border-radius:50% 50% 10% 10%;
    background:linear-gradient(135deg,#70532a,#d0a85b,#392812);
    border:3px solid #c89e51;
}

.dome:after{
    content:"✦";
    position:absolute;
    top:-45px;
    left:47%;
    color:#e9c56d;
    font-size:40px;
}

.columns{
    position:absolute;
    inset:15% 5% 0;
    display:flex;
    justify-content:space-around;
    align-items:stretch;
}

.column{
    width:55px;
    background:linear-gradient(90deg,#6b4f2a,#e1c37a,#674b27);
    border-radius:20px 20px 4px 4px;
    box-shadow:0 0 15px #000;
}

.door{
    width:180px;
    height:75%;
    align-self:end;
    background:linear-gradient(90deg,#130e08,#5b421e,#130e08);
    border:4px solid #c99e4e;
    border-bottom:0;
    border-radius:100px 100px 0 0;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 35px #c7963d55;
}

.door span{
    color:#f1ce7b;
    letter-spacing:5px;
    font-size:14px;
}

.content{
    position:relative;
    z-index:5;
    padding:20px;
    margin-bottom:35vh;
}

.eyebrow{
    color:#d6ae5e;
    letter-spacing:5px;
    font-size:12px;
    margin-bottom:18px;
}

h1{
    font-size:clamp(55px,13vw,125px);
    letter-spacing:12px;
    color:#f1d18a;
    text-shadow:
        0 0 10px #d8a84c,
        0 0 35px #8e682c;
    animation:glow 3s ease-in-out infinite alternate;
}

@keyframes glow{
    from{filter:brightness(.9)}
    to{filter:brightness(1.3)}
}

.tagline{
    margin:20px 0 30px;
    font-size:clamp(17px,3vw,28px);
    line-height:1.5;
    color:#fff4d7;
}

button{
    border:1px solid #c9a451;
    background:linear-gradient(135deg,#9a702e,#d7b45e,#815c25);
    color:#130e07;
    padding:16px 32px;
    font-family:Georgia,serif;
    font-weight:bold;
    letter-spacing:2px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:0 10px 35px #d0a44c66;
}

.section{
    min-height:75vh;
    padding:100px 8%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle at center,#241a0e,#070707 65%);
    border-top:1px solid #80612e55;
}

.section h2{
    font-size:clamp(35px,
